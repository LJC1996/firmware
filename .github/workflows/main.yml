name: Build AK3918EV300 with ONVIF & opkg

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            libncurses5-dev \
            file \
            bc \
            cpio \
            unzip \
            rsync \
            wget \
            git \
            sed \
            make \
            binutils \
            gcc \
            g++ \
            bash \
            patch \
            gzip \
            bzip2 \
            perl \
            tar \
            findutils \
            python3 \
            gawk \
            mawk

      - name: Clone OpenIPC Firmware
        uses: actions/checkout@v4
        with:
          repository: OpenIPC/firmware
          ref: master
          fetch-depth: 1
          submodules: recursive

      - name: Enable ONVIF and opkg in Config
        run: |
          cd $GITHUB_WORKSPACE
          
          # 修改 defconfig 文件
          DEFCONFIG="br-ext-chip-anyka/configs/ak3918ev300_lite_defconfig"
          
          # 确保文件存在
          if [ ! -f "$DEFCONFIG" ]; then
            echo "错误: 找不到配置文件 $DEFCONFIG"
            exit 1
          fi
          
          # 备份原配置
          cp $DEFCONFIG ${DEFCONFIG}.bak
          
          # 启用 ONVIF 相关功能
          cat >> $DEFCONFIG << 'EOF'
          
          # ONVIF Support
          BR2_PACKAGE_ONVIF=y
          BR2_PACKAGE_LIVE555=y
          BR2_PACKAGE_ONVIF_SERVER=y
          
          # Package Manager
          BR2_PACKAGE_OPKG=y
          BR2_PACKAGE_OPKG_LIBOPKG=y
          
          # Additional Features
          BR2_PACKAGE_MAJESTIC=y
          BR2_PACKAGE_MAJESTIC_WEBUI=y
          BR2_PACKAGE_IPCTOOL=y
          EOF
          
          echo "配置文件已更新"
          echo "=== 新增配置 ==="
          tail -15 $DEFCONFIG

      - name: Build Firmware
        run: |
          cd $GITHUB_WORKSPACE
          chmod +x building.sh 2>/dev/null || true
          
          # 尝试使用 building.sh
          if [ -f "building.sh" ]; then
            echo "使用官方构建脚本..."
            ./building.sh ak3918ev300_lite
          else
            echo "building.sh 不存在，使用手动构建..."
            
            # 下载 Buildroot
            wget -q https://github.com/buildroot/buildroot/archive/refs/tags/2021.02.12.tar.gz
            tar -xzf 2021.02.12.tar.gz
            mv buildroot-2021.02.12 buildroot
            
            # 合并配置
            cp -r br-ext-chip-anyka/configs/* buildroot/configs/
            cp -r br-ext-chip-anyka/package/* buildroot/package/ 2>/dev/null || true
            cp -r br-ext-chip-anyka/board/* buildroot/board/ 2>/dev/null || true
            
            cd buildroot
            make ak3918ev300_lite_defconfig
            
            # 确保功能已启用
            echo 'BR2_PACKAGE_ONVIF=y' >> .config
            echo 'BR2_PACKAGE_OPKG=y' >> .config
            echo 'BR2_PACKAGE_MAJESTIC=y' >> .config
            echo 'BR2_PACKAGE_MAJESTIC_WEBUI=y' >> .config
            echo 'BR2_PACKAGE_IPCTOOL=y' >> .config
            
            # 使用内部工具链避免下载问题
            sed -i 's/BR2_TOOLCHAIN_EXTERNAL=y/# BR2_TOOLCHAIN_EXTERNAL is not set/' .config
            echo 'BR2_TOOLCHAIN_BUILDROOT=y' >> .config
            
            make olddefconfig
            make -j$(nproc)
          fi

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ak3918-onvif-opkg-firmware
          path: |
            output/images/*.bin
            output/images/*.squashfs
            output/images/*.img
            output/images/*.ubi
            buildroot/output/images/
          if-no-files-found: warn
