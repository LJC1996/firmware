name: Build AK3918EV300 Full Firmware

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev
      
      - name: Configure and Build
        run: |
          # 先配置基础配置
          make ak3918ev300_lite_defconfig
          
          # 添加额外配置
          echo "BR2_PACKAGE_MAJESTIC=y" >> .config
          echo "BR2_PACKAGE_MAJESTIC_WEBUI=y" >> .config
          echo "BR2_PACKAGE_IPCTOOL=y" >> .config
          
          # 重新配置以解决依赖
          make olddefconfig
          
          # 执行构建
          make -j$(nproc)
      
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ak3918-full-firmware
          path: output/images/*.bin
