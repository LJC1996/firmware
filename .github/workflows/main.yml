name: Build AK3918EV300 Full Firmware

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OpenIPC/firmware
          ref: master
          fetch-depth: 1
          submodules: recursive
      
      - name: Build with OpenIPC Docker
        run: |
          # 使用 OpenIPC 官方构建镜像
          docker run --rm \
            -v ${{ github.workspace }}:/home/firmware \
            -w /home/firmware \
            openipc/buildroot-env:latest \
            bash -c "
              # 在 Docker 容器内构建
              make br-ext-chip-anyka/configs/ak3918ev300_lite_defconfig
              
              # 启用额外功能
              echo 'BR2_PACKAGE_MAJESTIC=y' >> .config
              echo 'BR2_PACKAGE_MAJESTIC_WEBUI=y' >> .config
              echo 'BR2_PACKAGE_IPCTOOL=y' >> .config
              
              make olddefconfig
              make -j\$(nproc)
            "
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ak3918-firmware
          path: output/images/
