name: Build AK3918EV300 with ONVIF & opkg

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential libncurses5-dev file bc cpio unzip rsync wget \
            git sed make binutils gcc g++ bash patch gzip bzip2 perl tar \
            findutils awk python3

      - name: Clone OpenIPC Firmware
        uses: actions/checkout@v4
        with:
          repository: OpenIPC/firmware
          ref: master
          fetch-depth: 1
          submodules: recursive

      - name: Enable ONVIF and opkg in Config
        run: |
          cd $GITHUB_WORKSPACE
          
          # 方法1：修改 defconfig 文件（永久启用）
          DEFCONFIG="br-ext-chip-anyka/configs/ak3918ev300_lite_defconfig"
          
          # 检查并添加 ONVIF 相关配置
          if ! grep -q "BR2_PACKAGE_ONVIF" $DEFCONFIG; then
            echo '# ONVIF Support' >> $DEFCONFIG
            echo 'BR2_PACKAGE_ONVIF=y' >> $DEFCONFIG
            echo 'BR2_PACKAGE_LIVE555=y' >> $DEFCONFIG
            echo 'BR2_PACKAGE_ONVIF_SERVER=y' >> $DEFCONFIG
          fi
          
          # 检查并添加 opkg 配置
          if ! grep -q "BR2_PACKAGE_OPKG" $DEFCONFIG; then
            echo '# opkg Package Manager' >> $DEFCONFIG
            echo 'BR2_PACKAGE_OPKG=y' >> $DEFCONFIG
            echo 'BR2_PACKAGE_OPKG_LIBOPKG=y' >> $DEFCONFIG
          fi
          
          # 确保 Majestic 和 WebUI 启用
          sed -i 's/# BR2_PACKAGE_MAJESTIC is not set/BR2_PACKAGE_MAJESTIC=y/' $DEFCONFIG
          sed -i 's/# BR2_PACKAGE_MAJESTIC_WEBUI is not set/BR2_PACKAGE_MAJESTIC_WEBUI=y/' $DEFCONFIG
          
          echo "配置文件已修改，ONVIF 和 opkg 已启用"
          
          # 显示修改后的配置
          echo "=== 启用的关键功能 ==="
          grep -E "ONVIF|OPKG|MAJESTIC" $DEFCONFIG

      - name: Build Firmware
        run: |
          cd $GITHUB_WORKSPACE
          chmod +x building.sh
          ./building.sh ak3918ev300_lite

      - name: Verify ONVIF and opkg in Build Output
        run: |
          echo "=== 验证固件内容 ==="
          
          # 查找生成的 rootfs 文件
          ROOTFS=$(find output/images -name "*.squashfs" -o -name "rootfs.*" | head -1)
          
          if [ -n "$ROOTFS" ] && command -v unsquashfs &> /dev/null; then
            echo "检查 rootfs 中的 ONVIF 和 opkg..."
            mkdir -p /tmp/rootfs
            unsquashfs -d /tmp/rootfs $ROOTFS 2>/dev/null || true
            
            # 检查 ONVIF 相关文件
            if find /tmp/rootfs -name "*onvif*" 2>/dev/null | grep -q .; then
              echo "✓ ONVIF 文件存在"
            else
              echo "⚠ ONVIF 文件未找到"
            fi
            
            # 检查 opkg
            if [ -f "/tmp/rootfs/usr/bin/opkg" ] || [ -f "/tmp/rootfs/bin/opkg" ]; then
              echo "✓ opkg 已安装"
            else
              echo "⚠ opkg 未找到"
            fi
          fi

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ak3918-onvif-opkg-firmware
          path: |
            output/images/*.bin
            output/images/*.squashfs
            output/images/*.img
            output/images/*.ubi
