name: Build AK3918EV300 Full Firmware

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OpenIPC/firmware
          ref: master
          fetch-depth: 1
          submodules: recursive
      
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev file bc cpio unzip rsync wget
      
      - name: Configure Firmware
        run: |
          # 方法1：使用 symbolic link 让 Buildroot 找到配置
          # 创建标准的 configs 目录软链接
          if [ -d "br-ext-chip-anyka/configs" ]; then
            ln -sf br-ext-chip-anyka/configs configs
            echo "创建 configs 软链接指向 br-ext-chip-anyka/configs"
          fi
          
          # 直接使用 defconfig 文件创建 .config
          echo "复制 defconfig 到 .config..."
          cp br-ext-chip-anyka/configs/ak3918ev300_lite_defconfig .config
          
          # 启用额外功能
          echo "启用额外包..."
          echo "BR2_PACKAGE_MAJESTIC=y" >> .config
          echo "BR2_PACKAGE_MAJESTIC_WEBUI=y" >> .config
          echo "BR2_PACKAGE_IPCTOOL=y" >> .config
          
          # 让 Buildroot 处理依赖关系
          echo "修复配置依赖..."
          make olddefconfig
          
          echo "配置完成"
      
      - name: Build Firmware
        run: |
          make -j$(nproc)
      
      - name: List artifacts
        run: |
          echo "构建完成，查找生成的固件："
          find output -name "*.bin" -o -name "*.squashfs" -o -name "*.img" 2>/dev/null
          ls -la output/images/ || echo "output/images 目录不存在"
          
          # 如果标准路径没有，查找所有可能的位置
          echo "搜索所有可能的固件文件："
          find . -type f \( -name "*.bin" -o -name "firmware*" -o -name "rootfs*" \) | grep -v ".git"
      
      - uses: actions/upload-artifact@v4
        with:
          name: ak3918-firmware
          path: |
            output/images/*
            output/target/*
            *.bin
            firmware*.img
